
<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunC.AI - 企业专属AI开发平台</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#3B82F6",
              "neon-blue": "#00D1FF",
              "neon-purple": "#BD00FF",
              "neon-orange": "#FF5C00",
              "background-black": "#000000",
            },
            fontFamily: {
              display: ["Space Grotesk", "Noto Sans SC", "sans-serif"],
              body: ["Inter", "Noto Sans SC", "sans-serif"],
              mono: ["Space Mono", "monospace"],
            },
            animation: {
              'marquee': 'marquee 35s linear infinite',
              'float': 'float 8s ease-in-out infinite',
              'aurora': 'aurora 12s ease-in-out infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              },
              aurora: {
                '0%, 100%': { transform: 'translate(0, 0) scale(1)', opacity: 0.2 },
                '50%': { transform: 'translate(20px, -30px) scale(1.1)', opacity: 0.4 },
              }
            }
          },
        },
      };
    </script>
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #000000;
        --border-color: rgba(0, 0, 0, 0.1);
      }
      .dark {
        --bg-color: #000000;
        --text-color: #ffffff;
        --border-color: rgba(255, 255, 255, 0.1);
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow-x: hidden;
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      /* 极致噪点纹理 */
      body::before {
        content: "";
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-image: url('https://grainy-gradients.vercel.app/noise.svg');
        opacity: 0.4;
        pointer-events: none;
        z-index: 9999;
      }
      .dark body::before {
        opacity: 0.4;
      }
      /* 直角玻璃卡片 */
      .glass-card {
        background: rgba(var(--card-bg-rgb, 255, 255, 255), 0.03);
        backdrop-filter: blur(40px) saturate(150%);
        border: 1px solid var(--border-color);
        transition: all 0.3s ease;
      }
      .dark .glass-card {
        background: rgba(255, 255, 255, 0.03);
      }
      .light .glass-card {
        background: rgba(0, 0, 0, 0.02);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      .pyramid-light {
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        background: linear-gradient(180deg, rgba(0, 209, 255, 0.4) 0%, transparent 100%);
        filter: blur(40px);
      }
      .v-line {
        width: 1px;
        background: linear-gradient(to bottom, transparent, var(--border-color), transparent);
      }
      .h-line {
        height: 1px;
        background: linear-gradient(to right, transparent, var(--border-color), transparent);
      }
      .text-outline {
        -webkit-text-stroke: 1px var(--border-color);
        color: transparent;
      }
      ::-webkit-scrollbar { width: 2px; }
      ::-webkit-scrollbar-track { background: var(--bg-color); }
      ::-webkit-scrollbar-thumb { background: #444; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="font-body">
    <div id="root"></div>
</body>
</html>
